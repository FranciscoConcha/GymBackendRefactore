name: ucn-gym-api
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ucn_gym_review}
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: .
    ports:
      - "127.0.0.1:5008:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=database;Port=5432;Database=${POSTGRES_DB:-ucn_gym_review};Username=${POSTGRES_USER:-gym};Password=${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
      Jwt__Key: ${JWT_KEY:?Configure JWT_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-ucn-gym-api}
      Jwt__Audience: ${JWT_AUDIENCE:-ucn-gym-frontend}
      Qr__SigningKey: ${QR_SIGNING_KEY:?Configure QR_SIGNING_KEY in .env}
      Cors__AllowedOrigins__0: http://localhost:4173
      Cors__AllowedOrigins__1: http://localhost:8080
      Database__Initialize: "true"
      # Solo el proxy del frontend (red interna de Compose) puede fijar X-Forwarded-For.
      ForwardedHeaders__Enabled: "true"
      ForwardedHeaders__KnownNetworks__0: 172.16.0.0/12
      Bootstrap__AdminRut: ${BOOTSTRAP_ADMIN_RUT:-}
      Bootstrap__AdminEmail: ${BOOTSTRAP_ADMIN_EMAIL:-}
      Bootstrap__AdminUsername: ${BOOTSTRAP_ADMIN_USERNAME:-}
      Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      database:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  database:
