name: CI
on:
  push:
    branches: [main, test, dev]
  pull_request:
    branches: [main, test, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - name: Format
        run: dotnet format GymBackend.slnx --verify-no-changes --no-restore
      - run: dotnet build -c Release --no-restore
      - name: Test con cobertura
        run: >
          dotnet test -c Release --no-build --logger trx --results-directory TestResults
          --collect "Code Coverage" --settings coverage.runsettings
      - name: Resumen de cobertura
        if: always()
        shell: bash
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          files = glob.glob("TestResults/**/*.cobertura.xml", recursive=True)
          print("## Cobertura")
          for f in files:
              r = ET.parse(f).getroot()
              print(f"- `{f.split('/')[-1]}`: líneas {float(r.get('line-rate', 0)) * 100:.1f} %, ramas {float(r.get('branch-rate', 0)) * 100:.1f} %")
          if not files:
              print("Sin informes de cobertura.")
          EOF
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: TestResults
          retention-days: 7
      - run: docker build -t ucn-gym-api:check .
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t ucn-gym-frontend:check .
