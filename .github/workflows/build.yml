name: CI
on:
  push:
    branches: [main, test, dev]
  pull_request:
    branches: [main, test, dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - name: Test (si existen proyectos de prueba)
        shell: bash
        run: |
          if ls tests/*/*.csproj >/dev/null 2>&1; then
            dotnet test -c Release --no-build --logger "trx" --results-directory TestResults
          else
            echo "Sin proyectos de prueba todavía."
          fi
      - run: docker build -t ucn-gym-api:check .
